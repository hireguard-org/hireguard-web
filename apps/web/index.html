<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ── SEO ── -->
  <title>HireGuard — Open Recruiter Verification Protocol</title>
  <meta name="description" content="Protect candidates from recruitment fraud. HireGuard is an open protocol for companies to declare legitimate hiring practices via hiring.txt — generate, publish, and verify." />

  <meta name="author" content="HireGuard" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://hireguard.org" />

  <!-- ── Open Graph ── -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="HireGuard — Open Recruiter Verification" />
  <meta property="og:description" content="An open protocol for companies to declare legitimate hiring practices. Generate, publish, and verify hiring.txt files to protect candidates from recruitment fraud." />
  <meta property="og:url" content="https://hireguard.org" />
  <meta property="og:site_name" content="HireGuard" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:locale:alternate" content="tr_TR" />
  <meta property="og:locale:alternate" content="es_ES" />
  <meta property="og:locale:alternate" content="de_DE" />
  <meta property="og:locale:alternate" content="fr_FR" />
  <meta property="og:locale:alternate" content="ar_SA" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="HireGuard — Open Recruiter Verification" />
  <meta name="twitter:description" content="An open protocol for companies to declare legitimate hiring practices via hiring.txt." />

  <meta name="theme-color" content="#0a0c10" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <meta property="og:image" content="https://hireguard.org/logo.png" />
  <meta name="twitter:image" content="https://hireguard.org/logo.png" />

  <!-- ── Fonts ── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
